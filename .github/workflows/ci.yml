# Intégration continue du front athlète : chaque pull request et chaque push
# sur main doivent passer l'analyse statique, les tests (unitaires,
# intégration, système, sécurité, accessibilité), l'audit des dépendances de
# production et la construction de l'image Docker.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Une nouvelle poussée sur la même branche annule l'exécution en cours.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Qualité et tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Analyse statique (ESLint)
        run: npm run lint

      - name: Contrôle des types (TypeScript)
        run: npx tsc --noEmit

      # Unitaires (jsdom) et intégration (Route Handlers et proxy, avec le
      # backend simulé par MSW) : aucun service externe.
      - name: Tests unitaires et d'intégration, avec couverture
        run: npm run test:coverage

      # Seules les dépendances embarquées en production bloquent ; celles de
      # développement sont suivies par Dependabot.
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high

      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium

      # Build de production branché sur l'API simulée (playwright.config.ts) :
      # parcours, sécurité (CSP, IDOR, redirections), accessibilité (axe).
      - name: Tests système, sécurité et accessibilité (Playwright)
        run: npm run test:e2e

      - name: Publier les rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-de-tests
          path: |
            coverage/
            playwright-report/
          retention-days: 14

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - name: Construire l'image de production
        run: docker build -t sessionized-athlete:ci .
