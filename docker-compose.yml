# Environnement conteneurisé du front athlète : l'application et les services
# dont elle dépend (API NestJS, PostgreSQL, Redis), sur une base locale jetable.
# Suppose le dépôt de l'API cloné à côté de celui-ci :
#
#   Sessionized/
#   ├── sessionized-api/
#   └── sessionized-athlete/   ← ce fichier
#
#   docker compose up --build                    puis http://localhost:3000
#   docker compose --profile demo up --build     idem, avec le jeu de données
#                                                de démonstration (comptes @demo.test)
#   docker compose down -v                       arrête tout et supprime la base
#
# Même enchaînement qu'en production : les migrations sont une étape
# distincte (service migrate), exécutée avec le rôle propriétaire de la base,
# avant le démarrage de l'API, qui se connecte avec un rôle sans droit sur le
# schéma (sessionized_app).
#
# Les valeurs par défaut ne valent que pour ce poste : en production, chaque
# secret vient du gestionnaire de secrets de l'hébergeur. Strava n'est pas
# configuré ici (l'application fonctionne sans compte relié).
name: sessionized

x-owner-url: &owner-url postgresql://sessionized:${POSTGRES_PASSWORD:-sessionized}@db:5432/sessionized
x-app-url: &app-url postgresql://sessionized_app:${APP_DB_PASSWORD:-sessionized_app}@db:5432/sessionized

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sessionized
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sessionized}
      POSTGRES_DB: sessionized
    # 5434 côté hôte : 5432 pour un PostgreSQL local, 5433 pour la base de
    # tests e2e de l'API. Exposé seulement sur la boucle locale (psql).
    ports: ["127.0.0.1:5434:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sessionized -d sessionized"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    # Compteurs de tentatives de connexion et jetons révoqués : éphémères,
    # aucune persistance sur disque.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Étape de déploiement, une fois : migrations puis droits du rôle applicatif.
  migrate:
    build: ../sessionized-api
    command: ["sh", "-c", "node scripts/migrate.js deploy && node scripts/grant-app-role.js"]
    environment:
      DATABASE_URL: *owner-url
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-sessionized_app}
    depends_on:
      db: { condition: service_healthy }

  # Jeu de données de démonstration, seulement avec --profile demo. Le seed
  # refuse NODE_ENV=production, valeur par défaut de l'image.
  seed:
    build: ../sessionized-api
    profiles: [demo]
    command: ["node", "dist/prisma/seed.js"]
    environment:
      NODE_ENV: development
      DATABASE_URL: *app-url
    depends_on:
      migrate: { condition: service_completed_successfully }

  api:
    build: ../sessionized-api
    # Pas d'env_file : le .env de l'API vise la base Neon partagée.
    environment:
      DATABASE_URL: *app-url
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-secret-de-developpement-local-uniquement-a-remplacer}
      JWT_EXPIRES_IN: 7d
      PORT: 3000
      CORS_ORIGINS: http://localhost:3000
      ATHLETE_APP_URL: http://localhost:3000
    # Port 3001 côté hôte, comme `npm run start:dev` de l'API.
    ports: ["127.0.0.1:3001:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  athlete:
    build:
      context: .
      args:
        # Figée dans le bundle au build (variable publique).
        NEXT_PUBLIC_COACH_APP_URL: http://localhost:3002
    environment:
      # Nom du service sur le réseau Compose : seul le serveur Next l'appelle,
      # jamais le navigateur.
      API_URL: http://api:3000
      COOKIE_DOMAIN: ""
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
